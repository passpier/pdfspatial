[package]
name = "pdfspatial-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Extract spatially-grounded, reading-order text from PDFs as a deterministic, OCR-free baseline for Markdown conversion."
documentation = "https://docs.rs/pdfspatial-core"
readme = "../../README.md"
keywords = ["pdf", "markdown", "pdfium", "layout", "extraction"]
categories = ["parser-implementations", "text-processing"]

[lib]
name = "pdfspatial_core"
path = "src/lib.rs"

[[example]]
name = "basic_extract"
path = "../../examples/basic_extract.rs"

[[example]]
name = "doclaynet_eval"
path = "../../examples/doclaynet_eval.rs"
required-features = ["doclaynet"]

[[example]]
name = "doclaynet_mine"
path = "../../examples/doclaynet_mine.rs"
required-features = ["doclaynet"]

[[example]]
name = "doclaynet_drafts"
path = "../../examples/doclaynet_drafts.rs"
required-features = ["doclaynet", "stage3"]

[[example]]
name = "stage3_pdf_cases"
path = "../../examples/stage3_pdf_cases.rs"
required-features = ["stage3"]

[[bench]]
name = "stage2_eval"
path = "../../benches/stage2_eval.rs"
harness = false
required-features = ["doclaynet"]

[[bench]]
name = "metrics"
path = "../../benches/metrics.rs"
harness = false

[features]
doclaynet = ["dep:serde", "dep:serde_json"]
stage3 = ["dep:serde", "dep:serde_json"]

[dependencies]
pdfium-render = "0.9"
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
